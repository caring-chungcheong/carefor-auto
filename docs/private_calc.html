<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>방문요양 사비 계산기</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--primary:#2f5c64;--primary2:#3a6f78;--accent:#c17c8f;
        --ink:#19212e;--muted:#5c6775;--faint:#93a0b0;--line:#e3e9ec;--bg:#f6f8f9;--card:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',system-ui,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{position:relative;background:linear-gradient(120deg,#2b555d,#37676f);color:#fff;
         padding:22px 20px 20px;text-align:center}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,#e6bcc7,var(--accent),#e6bcc7)}
  header h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
  header p{font-size:14px;opacity:.85;margin-top:6px}

  .wrap{max-width:620px;margin:0 auto;padding:26px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:24px;box-shadow:0 2px 12px rgba(16,32,38,.06)}

  .f{margin-bottom:16px}
  .f:last-of-type{margin-bottom:0}
  label{display:block;font-size:14px;font-weight:700;color:var(--primary2);margin-bottom:7px}
  .ip{display:flex;align-items:center;gap:10px}
  input{flex:1;border:1px solid var(--line);border-radius:11px;padding:14px 15px;
        font-size:20px;font-family:inherit;color:var(--ink);text-align:right;background:#fff}
  input:focus{outline:none;border-color:var(--primary2);box-shadow:0 0 0 3px rgba(58,111,120,.13)}
  .u{font-size:14px;color:var(--muted);font-weight:600;min-width:52px}

  .out{background:#f2f7f8;border:1px solid #dbe6e8;border-radius:14px;
       padding:24px;margin-top:22px;text-align:center}
  .out .k{font-size:14px;color:var(--muted);font-weight:600}
  .out .v{font-size:42px;font-weight:800;color:var(--primary);letter-spacing:-1px;margin-top:6px}
  .out .v small{font-size:19px;font-weight:700;color:var(--muted);margin-left:3px}
  .side{display:flex;gap:12px;margin-top:18px}
  .side div{flex:1;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .side .sk{font-size:12px;color:var(--faint);font-weight:700}
  .side .sv{font-size:19px;font-weight:800;color:var(--ink);margin-top:3px}
  .side .sv small{font-size:12.5px;font-weight:700;color:var(--muted)}

  .note{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:18px;
        background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .note b{color:var(--ink)}
</style></head><body>

<header>
  <h1>방문요양 사비 계산기</h1>
  <p>시급 · 하루 근무시간 · 근무일수 → 급여</p>
</header>

<div class="wrap">
  <div class="card">

    <div class="f">
      <label>요양보호사 시급</label>
      <div class="ip"><input id="wage" inputmode="numeric" placeholder="13,000"><span class="u">원</span></div>
    </div>

    <div class="f">
      <label>하루 근무시간</label>
      <div class="ip"><input id="hpd" inputmode="decimal" placeholder="3"><span class="u">시간</span></div>
    </div>

    <div class="f">
      <label>근무일수</label>
      <div class="ip"><input id="days" inputmode="decimal" placeholder="20"><span class="u">일</span></div>
    </div>

    <div class="out">
      <div class="k">급여</div>
      <div class="v"><span id="pay">–</span><small>원</small></div>
      <div class="side">
        <div><div class="sk">총 근무시간</div><div class="sv"><span id="tot">–</span><small> 시간</small></div></div>
        <div><div class="sk">하루 급여</div><div class="sv"><span id="daily">–</span><small> 원</small></div></div>
      </div>
    </div>

    <div class="note">
      <b>급여 = 시급 × 하루 근무시간 × 근무일수</b><br>
      시급을 비워두면 <b>13,000원</b>(케어링 방문요양 기준)으로 계산합니다.
      통상임금 산정은 최저시급 기준입니다.
    </div>

  </div>
</div>

<script>
var WAGE_DEFAULT = 13000;

function num(id) {
  var v = (document.getElementById(id).value || '').replace(/[^\d.]/g, '');
  return v === '' ? null : parseFloat(v);
}
function won(n) { return Math.round(n).toLocaleString('ko-KR'); }
function hr(n)  { return (Math.round(n * 10) / 10).toLocaleString('ko-KR'); }

function calc() {
  var wage = num('wage') || WAGE_DEFAULT,
      hpd  = num('hpd'),
      days = num('days');

  var tot = (hpd && days) ? hpd * days : null;
  document.getElementById('tot').textContent   = tot ? hr(tot) : '–';
  document.getElementById('daily').textContent = hpd ? won(wage * hpd) : '–';
  document.getElementById('pay').textContent   = tot ? won(tot * wage) : '–';
}

['wage', 'hpd', 'days'].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener('input', function () {
    if (id === 'wage') {                       // 금액 칸만 천 단위 콤마
      var raw = el.value.replace(/[^\d]/g, '');
      el.value = raw ? parseInt(raw, 10).toLocaleString('ko-KR') : '';
    }
    calc();
  });
});
calc();
</script>
</body></html>
